services:
  api:
    build:
      context: ..
      dockerfile: infra/docker/php/Dockerfile
    working_dir: /var/www/backend
    volumes:
      - ../backend:/var/www/backend
    env_file:
      - ../backend/.env
    depends_on:
      - mysql
      - redis

  queue:
    build:
      context: ..
      dockerfile: infra/docker/php/Dockerfile
    working_dir: /var/www/backend
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/queue.conf"]
    volumes:
      - ../backend:/var/www/backend
      - ./supervisor/queue.conf:/etc/supervisor/conf.d/queue.conf:ro
    env_file:
      - ../backend/.env
    depends_on:
      - api
      - redis

  frontend:
    image: node:22-alpine
    working_dir: /workspace/frontend
    command: sh -c "npm install && npm run start"
    volumes:
      - ../frontend:/workspace/frontend
    ports:
      - "4200:4200"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ../backend:/var/www/backend:ro
      - ../frontend/dist/municipal-saas-frontend/browser:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: municipal_saas
      MYSQL_USER: municipal
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

volumes:
  mysql-data:
